name: Windows installer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  public-install:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install from public download and check configuration preservation
        run: python tests/installer-smoke.py
